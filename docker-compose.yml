version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: xo_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-xo_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  orchestrator:
    build: ./orchestrator
    container_name: xo_orchestrator
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-xo_db}?schema=public
      API_KEY: ${API_KEY:-change-me}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  bridge:
    build: ./bridge
    container_name: xo_bridge
    restart: always
    environment:
      ORCHESTRATOR_URL: http://orchestrator:3000
      API_KEY: ${API_KEY:-change-me}
      HOST: 0.0.0.0
      PORT: 3100
      DEFAULT_WORKFLOW: ${DEFAULT_WORKFLOW:-openclaw_chat}
    ports:
      - "3100:3100"
    depends_on:
      - orchestrator

volumes:
  postgres_data:
